services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phiguard
      POSTGRES_PASSWORD: phiguard_dev
      POSTGRES_DB: phiguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phiguard -d phiguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
